[project]
name = "terminai-pyats"
version = "0.1.0"
description = "Cisco pyATS/Genie CLI and Python client for TerminAI"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "TerminAI", email = "you@your-domain.com" }
]
license = { text = "MIT" }
dependencies = [
    "pyats[full]>=24.0",
    "genie>=24.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
pyats-cli = "terminai_pyats.cli.main:app"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "live_device: tests that require a real device (skipped by default)",
]

[tool.coverage.run]
source = ["terminai_pyats"]
omit = ["*/tests/*", "*/cli/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
