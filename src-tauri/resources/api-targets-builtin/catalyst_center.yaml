id: catalyst_center
display_name: "Cisco Catalyst Center (DNA-C)"
schema_version: 1
base_url: "https://${env:DNAC_HOST}"
openapi_url: "https://developer.cisco.com/docs/catalyst-center/overview/"
auth:
  type: token_login
  login:
    method: POST
    url: "/dna/system/api/v1/auth/token"
    credentials:
      type: basic
      username: "${env:DNAC_USER}"
      password: "${env:DNAC_PASS}"
    token_jsonpath: "$.Token"
  apply:
    mode: header
    name: "X-Auth-Token"
  refresh_on_status: [401]
tls:
  verify: false
defaults:
  headers:
    "Accept": "application/json"
    "Content-Type": "application/json"
endpoints:
  - id: "catalyst_center__get_get_anc_policies"
    name: "Fetches the list of ANC policies available in ISE."
    method: GET
    path: "/dna/intent/api/v1/endpoint-analytics/anc-policies"
  - id: "catalyst_center__post_process_cmdb_endpoints"
    name: "Processes incoming CMDB endpoints data and imports the same in AI Endpoint Analytics."
    method: POST
    path: "/dna/intent/api/v1/endpoint-analytics/cmdb/endpoints"
  - id: "catalyst_center__get_get_ai_endpoint_analytics_attribute_dictionaries"
    name: "Fetches the list of attribute dictionaries."
    method: GET
    path: "/dna/intent/api/v1/endpoint-analytics/dictionaries"
  - id: "catalyst_center__get_query_the_endpoints"
    name: "Query the endpoints, optionally using various filter and pagination criteria. 'GET /endpoints/count' API can be"
    method: GET
    path: "/dna/intent/api/v1/endpoint-analytics/endpoints"
  - id: "catalyst_center__post_register_an_endpoint"
    name: "Register a new endpoint in the system."
    method: POST
    path: "/dna/intent/api/v1/endpoint-analytics/endpoints"
  - id: "catalyst_center__get_fetch_the_count_of_endpoints"
    name: "Fetch the total count of endpoints that match the given filter criteria."
    method: GET
    path: "/dna/intent/api/v1/endpoint-analytics/endpoints/count"
  - id: "catalyst_center__delete_delete_an_endpoint"
    name: "Deletes the endpoint for the given unique identifier 'epId'."
    method: DELETE
    path: "/dna/intent/api/v1/endpoint-analytics/endpoints/{epId}"
  - id: "catalyst_center__get_get_endpoint_details"
    name: "Fetches details of the endpoint for the given unique identifier 'epId'."
    method: GET
    path: "/dna/intent/api/v1/endpoint-analytics/endpoints/{epId}"
  - id: "catalyst_center__put_update_a_registered_endpoint"
    name: "Update attributes of a registered endpoint."
    method: PUT
    path: "/dna/intent/api/v1/endpoint-analytics/endpoints/{epId}"
  - id: "catalyst_center__get_get_list_of_profiling_rules"
    name: "This API fetches the list of profiling rules. It can be used to show profiling rules in client applications, or"
    method: GET
    path: "/dna/intent/api/v1/endpoint-analytics/profiling-rules"
  - id: "catalyst_center__post_create_a_profiling_rule"
    name: "Creates profiling rule from the request body."
    method: POST
    path: "/dna/intent/api/v1/endpoint-analytics/profiling-rules"
  - id: "catalyst_center__get_get_task_details"
    name: "Fetches the details of backend task. Task is typically created by making call to some other API that takes"
    method: GET
    path: "/dna/intent/api/v1/endpoint-analytics/tasks/{taskId}"
  - id: "catalyst_center__get_get_application_policy"
    name: "Get all existing application policies."
    method: GET
    path: "/dna/intent/api/v1/app-policy"
  - id: "catalyst_center__get_get_application_policy_default"
    name: "Get default application policy."
    method: GET
    path: "/dna/intent/api/v1/app-policy-default"
  - id: "catalyst_center__post_application_policy_intent"
    name: "Create/Update/Delete application policy."
    method: POST
    path: "/dna/intent/api/v1/app-policy-intent"
  - id: "catalyst_center__get_get_application_policy_queuing_profile"
    name: "Get all or by name, existing application policy queuing profiles."
    method: GET
    path: "/dna/intent/api/v1/app-policy-queuing-profile"
  - id: "catalyst_center__post_create_application_policy_queuing_profile"
    name: "Create new custom application queuing profile."
    method: POST
    path: "/dna/intent/api/v1/app-policy-queuing-profile"
  - id: "catalyst_center__put_update_application_policy_queuing_profile"
    name: "Update existing custom application queuing profile."
    method: PUT
    path: "/dna/intent/api/v1/app-policy-queuing-profile"
  - id: "catalyst_center__get_get_application_policy_queuing_profile_count"
    name: "Get the number of all existing  application policy queuing profile."
    method: GET
    path: "/dna/intent/api/v1/app-policy-queuing-profile-count"
  - id: "catalyst_center__delete_delete_application_policy_queuing_profile"
    name: "Delete existing custom application policy queuing profile by id."
    method: DELETE
    path: "/dna/intent/api/v1/app-policy-queuing-profile/{id}"
  - id: "catalyst_center__delete_delete_application_set"
