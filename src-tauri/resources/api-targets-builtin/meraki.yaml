id: meraki
display_name: "Cisco Meraki Dashboard"
schema_version: 1
base_url: "https://api.meraki.com/api/v1"
openapi_url: "https://raw.githubusercontent.com/meraki/openapi/master/openapi/spec3.json"
auth:
  type: header
  header_name: "X-Cisco-Meraki-API-Key"
  value: "${env:MERAKI_API_KEY}"
tls:
  verify: true
defaults:
  headers:
    "Accept": "application/json"
    "Content-Type": "application/json"
endpoints:
  - id: "meraki__get_getadministeredidentitiesme"
    name: "Returns the identity of the current user."
    method: GET
    path: "/administered/identities/me"
  - id: "meraki__get_getadministeredidentitiesmeapikeys"
    name: "List the non-sensitive metadata associated with the API keys that belong to the user"
    method: GET
    path: "/administered/identities/me/api/keys"
  - id: "meraki__post_generateadministeredidentitiesmeapikeys"
    name: "Generates an API key for an identity"
    method: POST
    path: "/administered/identities/me/api/keys/generate"
  - id: "meraki__post_revokeadministeredidentitiesmeapikeys"
    name: "Revokes an identity's API key, using the last four characters of the key"
    method: POST
    path: "/administered/identities/me/api/keys/{suffix}/revoke"
  - id: "meraki__get_getadministeredlicensingsubscriptionentitlements"
    name: "Retrieve the list of purchasable entitlements"
    method: GET
    path: "/administered/licensing/subscription/entitlements"
  - id: "meraki__get_getadministeredlicensingsubscriptionsubscriptions"
    name: "List available subscriptions"
    method: GET
    path: "/administered/licensing/subscription/subscriptions"
  - id: "meraki__post_claimadministeredlicensingsubscriptionsubscriptions"
    name: "Claim a subscription into an organization."
    method: POST
    path: "/administered/licensing/subscription/subscriptions/claim"
  - id: "meraki__post_validateadministeredlicensingsubscriptionsubscriptionsclaimkey"
    name: "Find a subscription by claim key"
    method: POST
    path: "/administered/licensing/subscription/subscriptions/claimKey/validate"
  - id: "meraki__get_getadministeredlicensingsubscriptionsubscriptionscompliancestatuses"
    name: "Get compliance status for requested subscriptions"
    method: GET
    path: "/administered/licensing/subscription/subscriptions/compliance/statuses"
  - id: "meraki__post_bindadministeredlicensingsubscriptionsubscription"
    name: "Bind networks to a subscription"
    method: POST
    path: "/administered/licensing/subscription/subscriptions/{subscriptionId}/bind"
  - id: "meraki__get_getdevice"
    name: "Return a single device"
    method: GET
    path: "/devices/{serial}"
  - id: "meraki__put_updatedevice"
    name: "Update the attributes of a device"
    method: PUT
    path: "/devices/{serial}"
  - id: "meraki__get_getdeviceappliancedhcpsubnets"
    name: "Return the DHCP subnet information for an appliance"
    method: GET
    path: "/devices/{serial}/appliance/dhcp/subnets"
  - id: "meraki__get_getdeviceapplianceperformance"
    name: "Return the performance score for a single MX"
    method: GET
    path: "/devices/{serial}/appliance/performance"
  - id: "meraki__get_getdeviceapplianceprefixesdelegated"
    name: "Return current delegated IPv6 prefixes on an appliance."
    method: GET
    path: "/devices/{serial}/appliance/prefixes/delegated"
  - id: "meraki__get_getdeviceapplianceprefixesdelegatedvlanassignments"
    name: "Return prefixes assigned to all IPv6 enabled VLANs on an appliance."
    method: GET
    path: "/devices/{serial}/appliance/prefixes/delegated/vlanAssignments"
  - id: "meraki__get_getdeviceapplianceradiosettings"
    name: "Return the radio settings of an appliance"
    method: GET
    path: "/devices/{serial}/appliance/radio/settings"
  - id: "meraki__put_updatedeviceapplianceradiosettings"
    name: "Update the radio settings of an appliance"
    method: PUT
    path: "/devices/{serial}/appliance/radio/settings"
  - id: "meraki__get_getdeviceapplianceuplinkssettings"
    name: "Return the uplink settings for an MX appliance"
    method: GET
    path: "/devices/{serial}/appliance/uplinks/settings"
  - id: "meraki__put_updatedeviceapplianceuplinkssettings"
    name: "Update the uplink settings for an MX appliance"
    method: PUT
    path: "/devices/{serial}/appliance/uplinks/settings"
  - id: "meraki__post_createdeviceappliancevmxauthenticationtoken"
    name: "Generate a new vMX authentication token"
    method: POST
    path: "/devices/{serial}/appliance/vmx/authenticationToken"
  - id: "meraki__post_blinkdeviceleds"
    name: "Blink the LEDs on a device"
    method: POST
    path: "/devices/{serial}/blinkLeds"
  - id: "meraki__get_getdevicecameraanalyticslive"
    name: "Returns live state from camera analytics zones"
    method: GET
    path: "/devices/{serial}/camera/analytics/live"
  - id: "meraki__get_getdevicecameraanalyticsoverview"
    name: "Returns an overview of aggregate analytics data for a timespan"
    method: GET
    path: "/devices/{serial}/camera/analytics/overview"
  - id: "meraki__get_getdevicecameraanalyticsrecent"
    name: "Returns most recent record for analytics zones"
    method: GET
    path: "/devices/{serial}/camera/analytics/recent"
  - id: "meraki__get_getdevicecameraanalyticszones"
    name: "Returns all configured analytic zones for this camera"
    method: GET
    path: "/devices/{serial}/camera/analytics/zones"
  - id: "meraki__get_getdevicecameraanalyticszonehistory"
    name: "Return historical records for analytic zones"
    method: GET
    path: "/devices/{serial}/camera/analytics/zones/{zoneId}/history"
  - id: "meraki__get_clipdevicecamera"
    name: "Generate a video clip of up to 5 minutes long."
    method: GET
    path: "/devices/{serial}/camera/clip"
  - id: "meraki__get_getdevicecameracustomanalytics"
    name: "Return custom analytics settings for a camera"
    method: GET
    path: "/devices/{serial}/camera/customAnalytics"
  - id: "meraki__put_updatedevicecameracustomanalytics"
    name: "Update custom analytics settings for a camera"
    method: PUT
    path: "/devices/{serial}/camera/customAnalytics"
  - id: "meraki__post_generatedevicecamerasnapshot"
    name: "Generate a snapshot of what the camera sees at the specified time and return a link to that image."
    method: POST
    path: "/devices/{serial}/camera/generateSnapshot"
  - id: "meraki__get_getdevicecameraqualityandretention"
    name: "Returns quality and retention settings for the given camera"
    method: GET
    path: "/devices/{serial}/camera/qualityAndRetention"
  - id: "meraki__put_updatedevicecameraqualityandretention"
    name: "Update quality and retention settings for the given camera"
    method: PUT
    path: "/devices/{serial}/camera/qualityAndRetention"
  - id: "meraki__get_getdevicecamerasense"
    name: "Returns sense settings for a given camera"
    method: GET
    path: "/devices/{serial}/camera/sense"
  - id: "meraki__put_updatedevicecamerasense"
    name: "Update sense settings for the given camera"
    method: PUT
    path: "/devices/{serial}/camera/sense"
  - id: "meraki__get_getdevicecamerasenseobjectdetectionmodels"
    name: "Returns the MV Sense object detection model list for the given camera"
    method: GET
    path: "/devices/{serial}/camera/sense/objectDetectionModels"
  - id: "meraki__get_getdevicecameravideosettings"
    name: "Returns video settings for the given camera"
    method: GET
    path: "/devices/{serial}/camera/video/settings"
  - id: "meraki__put_updatedevicecameravideosettings"
    name: "Update video settings for the given camera"
    method: PUT
    path: "/devices/{serial}/camera/video/settings"
  - id: "meraki__get_getdevicecameravideolink"
    name: "Returns video link to the specified camera"
    method: GET
    path: "/devices/{serial}/camera/videoLink"
  - id: "meraki__get_getdevicecamerawirelessprofiles"
    name: "Returns wireless profile assigned to the given camera"
    method: GET
    path: "/devices/{serial}/camera/wirelessProfiles"
  - id: "meraki__put_updatedevicecamerawirelessprofiles"
    name: "Assign wireless profiles to the given camera"
    method: PUT
    path: "/devices/{serial}/camera/wirelessProfiles"
  - id: "meraki__get_getdevicecellularsims"
    name: "Return the SIM and APN configurations for a cellular device."
    method: GET
    path: "/devices/{serial}/cellular/sims"
  - id: "meraki__put_updatedevicecellularsims"
    name: "Updates the SIM and APN configurations for a cellular device."
    method: PUT
    path: "/devices/{serial}/cellular/sims"
  - id: "meraki__get_getdevicecellulargatewaylan"
    name: "Show the LAN Settings of a MG"
    method: GET
    path: "/devices/{serial}/cellularGateway/lan"
  - id: "meraki__put_updatedevicecellulargatewaylan"
    name: "Update the LAN Settings for a single MG."
    method: PUT
    path: "/devices/{serial}/cellularGateway/lan"
  - id: "meraki__get_getdevicecellulargatewayportforwardingrules"
    name: "Returns the port forwarding rules for a single MG."
    method: GET
    path: "/devices/{serial}/cellularGateway/portForwardingRules"
  - id: "meraki__put_updatedevicecellulargatewayportforwardingrules"
    name: "Updates the port forwarding rules for a single MG."
    method: PUT
    path: "/devices/{serial}/cellularGateway/portForwardingRules"
  - id: "meraki__get_getdeviceclients"
    name: "List the clients of a device, up to a maximum of a month ago"
    method: GET
    path: "/devices/{serial}/clients"
  - id: "meraki__post_createdevicelivetoolsarptable"
    name: "Enqueue a job to perform a ARP table request for the device"
    method: POST
    path: "/devices/{serial}/liveTools/arpTable"
  - id: "meraki__get_getdevicelivetoolsarptable"
    name: "Return an ARP table live tool job."
    method: GET
    path: "/devices/{serial}/liveTools/arpTable/{arpTableId}"
  - id: "meraki__post_createdevicelivetoolscabletest"
    name: "Enqueue a job to perform a cable test for the device on the specified ports"
    method: POST
    path: "/devices/{serial}/liveTools/cableTest"
  - id: "meraki__get_getdevicelivetoolscabletest"
    name: "Return a cable test live tool job."
    method: GET
    path: "/devices/{serial}/liveTools/cableTest/{id}"
  - id: "meraki__post_createdevicelivetoolsledsblink"
    name: "Enqueue a job to blink LEDs on a device"
    method: POST
    path: "/devices/{serial}/liveTools/leds/blink"
  - id: "meraki__get_getdevicelivetoolsledsblink"
    name: "Return a blink LEDs job"
    method: GET
    path: "/devices/{serial}/liveTools/leds/blink/{ledsBlinkId}"
  - id: "meraki__post_createdevicelivetoolsmactable"
    name: "Enqueue a job to request the MAC table from the device"
    method: POST
    path: "/devices/{serial}/liveTools/macTable"
  - id: "meraki__get_getdevicelivetoolsmactable"
    name: "Return a MAC table live tool job."
    method: GET
    path: "/devices/{serial}/liveTools/macTable/{macTableId}"
  - id: "meraki__post_createdevicelivetoolsmulticastrouting"
    name: "Enqueue a job to perform a Multicast routing request for the device"
    method: POST
    path: "/devices/{serial}/liveTools/multicastRouting"
  - id: "meraki__get_getdevicelivetoolsmulticastrouting"
    name: "Return a Multicast routing live tool job."
    method: GET
    path: "/devices/{serial}/liveTools/multicastRouting/{multicastRoutingId}"
  - id: "meraki__post_createdevicelivetoolsping"
    name: "Enqueue a job to ping a target host from the device"
    method: POST
    path: "/devices/{serial}/liveTools/ping"
  - id: "meraki__get_getdevicelivetoolsping"
    name: "Return a ping job"
    method: GET
    path: "/devices/{serial}/liveTools/ping/{id}"
  - id: "meraki__post_createdevicelivetoolspingdevice"
    name: "Enqueue a job to check connectivity status to the device"
    method: POST
    path: "/devices/{serial}/liveTools/pingDevice"
  - id: "meraki__get_getdevicelivetoolspingdevice"
    name: "Return a ping device job"
    method: GET
    path: "/devices/{serial}/liveTools/pingDevice/{id}"
  - id: "meraki__post_createdevicelivetoolsthroughputtest"
    name: "Enqueue a job to test a device throughput, the test will run for 10 secs to test throughput"
    method: POST
    path: "/devices/{serial}/liveTools/throughputTest"
  - id: "meraki__get_getdevicelivetoolsthroughputtest"
    name: "Return a throughput test job"
    method: GET
    path: "/devices/{serial}/liveTools/throughputTest/{throughputTestId}"
  - id: "meraki__post_createdevicelivetoolswakeonlan"
    name: "Enqueue a job to send a Wake-on-LAN packet from the device"
    method: POST
    path: "/devices/{serial}/liveTools/wakeOnLan"
  - id: "meraki__get_getdevicelivetoolswakeonlan"
    name: "Return a Wake-on-LAN job"
    method: GET
    path: "/devices/{serial}/liveTools/wakeOnLan/{wakeOnLanId}"
  - id: "meraki__get_getdevicelldpcdp"
    name: "List LLDP and CDP information for a device"
    method: GET
    path: "/devices/{serial}/lldpCdp"
  - id: "meraki__get_getdevicelossandlatencyhistory"
    name: "Get the uplink loss percentage and latency in milliseconds, and goodput in kilobits per second for MX, MG and Z devices."
    method: GET
    path: "/devices/{serial}/lossAndLatencyHistory"
  - id: "meraki__get_getdevicemanagementinterface"
    name: "Return the management interface settings for a device"
    method: GET
    path: "/devices/{serial}/managementInterface"
  - id: "meraki__put_updatedevicemanagementinterface"
    name: "Update the management interface settings for a device"
    method: PUT
    path: "/devices/{serial}/managementInterface"
  - id: "meraki__post_rebootdevice"
    name: "Reboot a device"
    method: POST
    path: "/devices/{serial}/reboot"
  - id: "meraki__get_getdevicesensorcommands"
    name: "Returns a historical log of all commands"
    method: GET
    path: "/devices/{serial}/sensor/commands"
  - id: "meraki__post_createdevicesensorcommand"
    name: "Sends a command to a sensor"
    method: POST
    path: "/devices/{serial}/sensor/commands"
  - id: "meraki__get_getdevicesensorcommand"
    name: "Returns information about the command's execution, including the status"
    method: GET
    path: "/devices/{serial}/sensor/commands/{commandId}"
  - id: "meraki__get_getdevicesensorrelationships"
    name: "List the sensor roles for a given sensor or camera device."
    method: GET
    path: "/devices/{serial}/sensor/relationships"
  - id: "meraki__put_updatedevicesensorrelationships"
    name: "Assign one or more sensor roles to a given sensor or camera device."
    method: PUT
    path: "/devices/{serial}/sensor/relationships"
  - id: "meraki__get_getdeviceswitchports"
    name: "List the switch ports for a switch"
    method: GET
    path: "/devices/{serial}/switch/ports"
  - id: "meraki__post_cycledeviceswitchports"
    name: "Cycle a set of switch ports"
    method: POST
    path: "/devices/{serial}/switch/ports/cycle"
  - id: "meraki__get_getdeviceswitchportsstatuses"
    name: "Return the status for all the ports of a switch"
    method: GET
    path: "/devices/{serial}/switch/ports/statuses"
  - id: "meraki__get_getdeviceswitchportsstatusespackets"
    name: "Return the packet counters for all the ports of a switch"
    method: GET
    path: "/devices/{serial}/switch/ports/statuses/packets"
  - id: "meraki__get_getdeviceswitchport"
    name: "Return a switch port"
    method: GET
    path: "/devices/{serial}/switch/ports/{portId}"
  - id: "meraki__put_updatedeviceswitchport"
    name: "Update a switch port"
    method: PUT
    path: "/devices/{serial}/switch/ports/{portId}"
  - id: "meraki__get_getdeviceswitchroutinginterfaces"
    name: "List layer 3 interfaces for a switch"
    method: GET
    path: "/devices/{serial}/switch/routing/interfaces"
  - id: "meraki__post_createdeviceswitchroutinginterface"
    name: "Create a layer 3 interface for a switch"
    method: POST
    path: "/devices/{serial}/switch/routing/interfaces"
  - id: "meraki__get_getdeviceswitchroutinginterface"
    name: "Return a layer 3 interface for a switch"
    method: GET
    path: "/devices/{serial}/switch/routing/interfaces/{interfaceId}"
  - id: "meraki__put_updatedeviceswitchroutinginterface"
    name: "Update a layer 3 interface for a switch"
    method: PUT
    path: "/devices/{serial}/switch/routing/interfaces/{interfaceId}"
  - id: "meraki__delete_deletedeviceswitchroutinginterface"
    name: "Delete a layer 3 interface from the switch"
    method: DELETE
    path: "/devices/{serial}/switch/routing/interfaces/{interfaceId}"
  - id: "meraki__get_getdeviceswitchroutinginterfacedhcp"
    name: "Return a layer 3 interface DHCP configuration for a switch"
    method: GET
    path: "/devices/{serial}/switch/routing/interfaces/{interfaceId}/dhcp"
  - id: "meraki__put_updatedeviceswitchroutinginterfacedhcp"
    name: "Update a layer 3 interface DHCP configuration for a switch"
    method: PUT
    path: "/devices/{serial}/switch/routing/interfaces/{interfaceId}/dhcp"
  - id: "meraki__get_getdeviceswitchroutingstaticroutes"
    name: "List layer 3 static routes for a switch"
    method: GET
    path: "/devices/{serial}/switch/routing/staticRoutes"
  - id: "meraki__post_createdeviceswitchroutingstaticroute"
    name: "Create a layer 3 static route for a switch"
    method: POST
    path: "/devices/{serial}/switch/routing/staticRoutes"
  - id: "meraki__get_getdeviceswitchroutingstaticroute"
    name: "Return a layer 3 static route for a switch"
    method: GET
    path: "/devices/{serial}/switch/routing/staticRoutes/{staticRouteId}"
  - id: "meraki__put_updatedeviceswitchroutingstaticroute"
    name: "Update a layer 3 static route for a switch"
    method: PUT
    path: "/devices/{serial}/switch/routing/staticRoutes/{staticRouteId}"
  - id: "meraki__delete_deletedeviceswitchroutingstaticroute"
    name: "Delete a layer 3 static route for a switch"
    method: DELETE
    path: "/devices/{serial}/switch/routing/staticRoutes/{staticRouteId}"
  - id: "meraki__get_getdeviceswitchwarmspare"
    name: "Return warm spare configuration for a switch"
    method: GET
    path: "/devices/{serial}/switch/warmSpare"
  - id: "meraki__put_updatedeviceswitchwarmspare"
    name: "Update warm spare configuration for a switch"
    method: PUT
    path: "/devices/{serial}/switch/warmSpare"
  - id: "meraki__put_updatedevicewirelessalternatemanagementinterfaceipv6"
    name: "Update alternate management interface IPv6 address"
    method: PUT
    path: "/devices/{serial}/wireless/alternateManagementInterface/ipv6"
  - id: "meraki__get_getdevicewirelessbluetoothsettings"
    name: "Return the bluetooth settings for a wireless device"
    method: GET
    path: "/devices/{serial}/wireless/bluetooth/settings"
  - id: "meraki__put_updatedevicewirelessbluetoothsettings"
    name: "Update the bluetooth settings for a wireless device"
    method: PUT
    path: "/devices/{serial}/wireless/bluetooth/settings"
  - id: "meraki__get_getdevicewirelessconnectionstats"
    name: "Aggregated connectivity info for a given AP on this network"
    method: GET
    path: "/devices/{serial}/wireless/connectionStats"
  - id: "meraki__get_getdevicewirelesselectronicshelflabel"
    name: "Return the ESL settings of a device"
    method: GET
    path: "/devices/{serial}/wireless/electronicShelfLabel"
  - id: "meraki__put_updatedevicewirelesselectronicshelflabel"
    name: "Update the ESL settings of a device"
    method: PUT
    path: "/devices/{serial}/wireless/electronicShelfLabel"
  - id: "meraki__get_getdevicewirelesslatencystats"
    name: "Aggregated latency info for a given AP on this network"
    method: GET
    path: "/devices/{serial}/wireless/latencyStats"
  - id: "meraki__get_getdevicewirelessradiosettings"
    name: "Return the manually configured radio settings overrides of a device, which take precedence over RF profiles."
    method: GET
    path: "/devices/{serial}/wireless/radio/settings"
  - id: "meraki__put_updatedevicewirelessradiosettings"
    name: "Update 2.4 GHz and 5 GHz radio settings (channel, channel width, power) that override RF profiles"
    method: PUT
    path: "/devices/{serial}/wireless/radio/settings"
  - id: "meraki__get_getdevicewirelessstatus"
    name: "Return the SSID statuses of an access point"
    method: GET
    path: "/devices/{serial}/wireless/status"
  - id: "meraki__post_createdevicewirelesszigbeeenrollment"
    name: "Enqueue a job to start enrolling door locks on zigbee configured wireless devices"
    method: POST
    path: "/devices/{serial}/wireless/zigbee/enrollments"
  - id: "meraki__get_getdevicewirelesszigbeeenrollment"
    name: "Return an enrollment"
    method: GET
    path: "/devices/{serial}/wireless/zigbee/enrollments/{enrollmentId}"
  - id: "meraki__get_getnetwork"
    name: "Return a network"
    method: GET
    path: "/networks/{networkId}"
  - id: "meraki__put_updatenetwork"
    name: "Update a network"
    method: PUT
    path: "/networks/{networkId}"
  - id: "meraki__delete_deletenetwork"
    name: "Delete a network"
    method: DELETE
    path: "/networks/{networkId}"
  - id: "meraki__get_getnetworkalertshistory"
    name: "Return the alert history for this network"
    method: GET
    path: "/networks/{networkId}/alerts/history"
  - id: "meraki__get_getnetworkalertssettings"
    name: "Return the alert configuration for this network"
    method: GET
    path: "/networks/{networkId}/alerts/settings"
  - id: "meraki__put_updatenetworkalertssettings"
    name: "Update the alert configuration for this network"
    method: PUT
    path: "/networks/{networkId}/alerts/settings"
  - id: "meraki__get_getnetworkapplianceclientsecurityevents"
    name: "List the security events for a client"
    method: GET
    path: "/networks/{networkId}/appliance/clients/{clientId}/security/events"
  - id: "meraki__get_getnetworkapplianceconnectivitymonitoringdestinations"
    name: "Return the connectivity testing destinations for an MX network"
    method: GET
    path: "/networks/{networkId}/appliance/connectivityMonitoringDestinations"
  - id: "meraki__put_updatenetworkapplianceconnectivitymonitoringdestinations"
    name: "Update the connectivity testing destinations for an MX network"
    method: PUT
    path: "/networks/{networkId}/appliance/connectivityMonitoringDestinations"
  - id: "meraki__get_getnetworkappliancecontentfiltering"
    name: "Return the content filtering settings for an MX network"
    method: GET
    path: "/networks/{networkId}/appliance/contentFiltering"
  - id: "meraki__put_updatenetworkappliancecontentfiltering"
    name: "Update the content filtering settings for an MX network"
    method: PUT
    path: "/networks/{networkId}/appliance/contentFiltering"
  - id: "meraki__get_getnetworkappliancecontentfilteringcategories"
    name: "List all available content filtering categories for an MX network"
    method: GET
    path: "/networks/{networkId}/appliance/contentFiltering/categories"
  - id: "meraki__get_getnetworkappliancefirewallcellularfirewallrules"
    name: "Return the cellular firewall rules for an MX network"
    method: GET
    path: "/networks/{networkId}/appliance/firewall/cellularFirewallRules"
  - id: "meraki__put_updatenetworkappliancefirewallcellularfirewallrules"
    name: "Update the cellular firewall rules of an MX network"
    method: PUT
    path: "/networks/{networkId}/appliance/firewall/cellularFirewallRules"
  - id: "meraki__get_getnetworkappliancefirewallfirewalledservices"
    name: "List the appliance services and their accessibility rules"
    method: GET
    path: "/networks/{networkId}/appliance/firewall/firewalledServices"
  - id: "meraki__get_getnetworkappliancefirewallfirewalledservice"
    name: "Return the accessibility settings of the given service ('ICMP', 'web', or 'SNMP')"
    method: GET
    path: "/networks/{networkId}/appliance/firewall/firewalledServices/{service}"
  - id: "meraki__put_updatenetworkappliancefirewallfirewalledservice"
    name: "Updates the accessibility settings for the given service ('ICMP', 'web', or 'SNMP')"
    method: PUT
    path: "/networks/{networkId}/appliance/firewall/firewalledServices/{service}"
  - id: "meraki__get_getnetworkappliancefirewallinboundcellularfirewallrules"
    name: "Return the inbound cellular firewall rules for an MX network"
    method: GET
    path: "/networks/{networkId}/appliance/firewall/inboundCellularFirewallRules"
  - id: "meraki__put_updatenetworkappliancefirewallinboundcellularfirewallrules"
    name: "Update the inbound cellular firewall rules of an MX network"
    method: PUT
    path: "/networks/{networkId}/appliance/firewall/inboundCellularFirewallRules"
  - id: "meraki__get_getnetworkappliancefirewallinboundfirewallrules"
    name: "Return the inbound firewall rules for an MX network"
    method: GET
    path: "/networks/{networkId}/appliance/firewall/inboundFirewallRules"
