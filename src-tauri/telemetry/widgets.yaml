schema_version: 1
widgets:
- widget: version
  title: Identity, version and uptime
  source:
    kind: ssh
    commands:
      ios: show version
      iosxe: show version
    templates:
      ios: ios.show_version
      iosxe: iosxe.show_version
  interval: 60
  key: []
  fields:
    hostname:
    - hostname
    - HOSTNAME
    version:
    - version
    - VERSION
    uptime:
    - uptime
    - UPTIME
    hardware:
    - hardware
    - HARDWARE
    serial:
    - serial
    - SERIAL
  view:
    type: kv
    columns:
    - field: hostname
      label: Hostname
    - field: version
      label: Version
    - field: uptime
      label: Uptime
    - field: hardware
      label: Hardware
    - field: serial
      label: Serial
- widget: cpu
  title: CPU and processes
  source:
    kind: ssh
    commands:
      ios: show processes cpu
      iosxe: show processes cpu
    templates:
      ios: ios.show_processes_cpu
      iosxe: iosxe.show_processes_cpu
  interval: 30
  key:
  - pid
  fields:
    pid:
    - process_pid
    - PROCESS_PID
    name:
    - process_name
    - PROCESS_NAME
    cpu_5s_percent:
    - cpu_usage_5_sec
    - CPU_USAGE_5_SEC
    cpu_1m_percent:
    - cpu_usage_1_min
    - CPU_USAGE_1_MIN
    cpu_5m_percent:
    - cpu_usage_5_min
    - CPU_USAGE_5_MIN
    process_5s_percent:
    - process_cpu_usage_5_sec
    - PROCESS_CPU_USAGE_5_SEC
  view:
    type: table
    columns:
    - field: pid
      label: Pid
    - field: name
      label: Name
    - field: cpu_5s_percent
      label: Cpu 5S Percent
      unit: '%'
    - field: cpu_1m_percent
      label: Cpu 1M Percent
      unit: '%'
    - field: cpu_5m_percent
      label: Cpu 5M Percent
      unit: '%'
    - field: process_5s_percent
      label: Process 5S Percent
      unit: '%'
- widget: memory
  title: Processor memory
  source:
    kind: ssh
    commands:
      ios: show processes memory sorted
      iosxe: show processes memory sorted
    templates:
      ios: ios.show_processes_memory_sorted
      iosxe: iosxe.show_processes_memory_sorted
  interval: 30
  key: []
  fields:
    total_bytes:
    - memory_total
    - MEMORY_TOTAL
    used_bytes:
    - memory_used
    - MEMORY_USED
    free_bytes:
    - memory_free
    - MEMORY_FREE
  view:
    type: kv
    columns:
    - field: total_bytes
      label: Total Bytes
      unit: B
    - field: used_bytes
      label: Used Bytes
      unit: B
    - field: free_bytes
      label: Free Bytes
      unit: B
  history:
    fields:
    - used_bytes
- widget: interfaces
  title: Interfaces, CLI average rates and errors
  source:
    kind: ssh
    commands:
      ios: show interfaces
      iosxe: show interfaces
    templates:
      ios: ios.show_interfaces
      iosxe: iosxe.show_interfaces
  interval: 30
  key:
  - interface
  fields:
    interface:
    - interface
    - INTERFACE
    link_state:
    - link_status
    - LINK_STATUS
    protocol_state:
    - protocol_status
    - PROTOCOL_STATUS
    description:
    - description
    - DESCRIPTION
    ip_address:
    - ip_address
    - IP_ADDRESS
    prefix_length:
    - prefix_length
    - PREFIX_LENGTH
    bandwidth:
    - bandwidth
    - BANDWIDTH
    input_cli_bit_s:
    - input_rate
    - INPUT_RATE
    output_cli_bit_s:
    - output_rate
    - OUTPUT_RATE
    input_packets:
    - input_packets
    - INPUT_PACKETS
    output_packets:
    - output_packets
    - OUTPUT_PACKETS
    input_errors:
    - input_errors
    - INPUT_ERRORS
    output_errors:
    - output_errors
    - OUTPUT_ERRORS
    input_drops:
    - queue_drops
    - QUEUE_DROPS
    output_drops:
    - queue_output_drops
    - QUEUE_OUTPUT_DROPS
  view:
    type: table
    columns:
    - field: interface
      label: Interface
    - field: link_state
      label: Link State
    - field: protocol_state
      label: Protocol State
    - field: description
      label: Description
    - field: ip_address
      label: Ip Address
    - field: prefix_length
      label: Prefix Length
    - field: bandwidth
      label: Bandwidth
    - field: input_cli_bit_s
      label: Input Cli Bit S
      unit: bit/s (CLI average)
    - field: output_cli_bit_s
      label: Output Cli Bit S
      unit: bit/s (CLI average)
    - field: input_packets
      label: Input Packets
      unit: packets
    - field: output_packets
      label: Output Packets
      unit: packets
    - field: input_errors
      label: Input Errors
      unit: errors
    - field: output_errors
      label: Output Errors
      unit: errors
    - field: input_drops
      label: Input Drops
      unit: packets
    - field: output_drops
      label: Output Drops
      unit: packets
- widget: interface_traffic
  title: Interface byte deltas and capacity
  source:
    kind: ssh
    commands:
      ios: show interfaces
      iosxe: show interfaces
    templates:
      ios: ios.interface_bytes
      iosxe: iosxe.interface_bytes
  interval: 30
  selected_interval: 5
  key:
  - interface
  fields:
    interface:
    - interface
    - INTERFACE
    input_bytes:
    - input_bytes
    - INPUT_BYTES
    output_bytes:
    - output_bytes
    - OUTPUT_BYTES
    capacity_kbit_s:
    - capacity_kbit_s
    - CAPACITY_KBIT_S
  view:
    type: table
    columns:
    - field: interface
      label: Interface
    - field: input_bytes
      label: Input Bytes
      unit: B
    - field: output_bytes
      label: Output Bytes
      unit: B
    - field: capacity_kbit_s
      label: Capacity Kbit S
      unit: kbit/s
    - field: input_bit_s
      label: Input Bit S
      unit: bit/s
    - field: output_bit_s
      label: Output Bit S
      unit: bit/s
    - field: input_util_percent
      label: Input Util Percent
      unit: '%'
    - field: output_util_percent
      label: Output Util Percent
      unit: '%'
  rates:
    input_bit_s:
      field: input_bytes
      multiplier: 8
      unit: bit/s
    output_bit_s:
      field: output_bytes
      multiplier: 8
      unit: bit/s
  computes:
    input_util_percent: input_bit_s / (capacity_kbit_s * 1000) * 100
    output_util_percent: output_bit_s / (capacity_kbit_s * 1000) * 100
  history:
    fields:
    - input_bit_s
    - output_bit_s
