name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.6"
  UV_VERSION: "0.8.19"

jobs:
  release-contract:
    name: release-contract
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Validate release manifests and updater identity
        run: python scripts/release_preflight.py check --no-git

      - name: Require a frozen Python lock
        working-directory: sidecar
        run: uv lock --check

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Test release helper scripts
        run: python -m unittest discover -s scripts/tests -v

      - name: ShellCheck release scripts
        run: >-
          shellcheck
          run.sh
          ci/sign-sidecar-macos.sh
          scripts/bump-version.sh
          scripts/check-release-environment.sh
          scripts/check-rustfmt-changed.sh
          scripts/verify-bundled-sidecar.sh
          scripts/verify-updater-key.sh
          sidecar/scripts/build_sidecar.sh

      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting only for changed Rust files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: scripts/check-rustfmt-changed.sh "$BASE_SHA" "$HEAD_SHA"

  rust-test:
    name: rust-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync frozen sidecar environment
        working-directory: sidecar
        run: uv sync --frozen --extra dev

      - name: Create placeholder resource for Rust-only checks
        shell: bash
        run: mkdir -p sidecar/dist/python

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Cargo test
        working-directory: src-tauri
        env:
          CCIE_REPO_ROOT: ${{ github.workspace }}
        run: cargo test --locked

  python-test:
    name: python-test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync and test from the frozen lock
        working-directory: sidecar
        run: |
          uv sync --frozen --extra dev
          uv run --frozen --extra dev pytest -v

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install from the frozen Bun lock
        run: bun install --frozen-lockfile

      - name: Run frontend tests
        run: bun run test

      - name: Build frontend
        run: bun run build:relaxed
