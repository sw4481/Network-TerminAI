name: nightly-guard

on:
  pull_request:

permissions:
  contents: read
  issues: read

jobs:
  guard-tests:
    name: guard-tests
    # Only applies to the nightly fixer's branches; your own PRs can edit tests
    if: startsWith(github.head_ref, 'nightly/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Nightly PRs may only ADD test files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          pattern='(^|/)(tests?|e2e)/|\.(test|spec)\.[jt]sx?$|(^|/)test_[^/]*\.py$|_test\.py$|_tests?\.rs$'
          changed=$(git diff --name-status --no-renames "origin/${BASE_REF}...HEAD" | grep -Ev '^A' | cut -f2 | grep -E "$pattern" || true)
          if [ -n "$changed" ]; then
            echo "Existing tests were modified or deleted:"
            echo "$changed"
            exit 1
          fi

      - name: Dependency changes need the owner's nightly-approved label
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          deps=$(git diff --name-only "origin/${BASE_REF}...HEAD" | grep -E '(^|/)(Cargo\.toml|Cargo\.lock|pyproject\.toml|uv\.lock|package\.json|bun\.lock)$' || true)
          if [ -z "$deps" ]; then
            echo "No dependency files changed."
            exit 0
          fi
          echo "Dependency files changed:"
          echo "$deps"
          n=$(echo "$HEAD_REF" | sed -nE 's#^nightly/issue-([0-9]+)$#\1#p')
          if [ -z "$n" ]; then
            echo "Branch $HEAD_REF is not nightly/issue-<N>, so there is no approval to check."
            exit 1
          fi
          approver=$(gh api --paginate "repos/${REPO}/issues/${n}/events" \
            --jq '.[] | select(.event == "labeled" and .label.name == "nightly-approved") | .actor.login' | tail -n 1)
          if [ "$approver" != "$OWNER" ]; then
            echo "Issue #${n} was not labeled nightly-approved by ${OWNER} (last labeled by: ${approver:-nobody})."
            exit 1
          fi
          echo "Issue #${n} was approved by ${approver}."
