name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      release_upload_url: ${{ steps.create-release.outputs.upload_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: tag_name
        run: echo "current_version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.tag_name.outputs.current_version }}`,
              name: `CCIE Terminal v${{ steps.tag_name.outputs.current_version }}`,
              body: 'See CHANGELOG.md for details.',
              draft: true,
              prerelease: false
            })
            return data.id

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            sidecar_triple: 'aarch64-apple-darwin'
          # x86_64-apple-darwin (Intel Mac) is dropped: cryptography has no
          # x86_64 wheel accepted by the Rosetta-emulated PBS interpreter on the
          # Apple-Silicon runner, and pip's source build cross-compiles its
          # Rust/OpenSSL extension and fails. Intel Macs are legacy and can't
          # auto-update anyway (Gatekeeper blocks unsigned/un-notarized macOS).
          - platform: 'windows-latest'
            args: ''
            sidecar_triple: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev build-essential curl wget file

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up sidecar venv + run tests (Unix)
        if: matrix.platform != 'windows-latest'
        working-directory: sidecar
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -e '.[dev]'
          pytest -v

      - name: Set up sidecar venv + run tests (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: sidecar
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\Activate.ps1
          pip install -e ".[dev]"
          pytest -v

      # Package a relocatable Python + pip-installed sidecar for Tauri's
      # bundle.resources. See sidecar/scripts/build_sidecar.sh for the
      # python-build-standalone approach (replaces the earlier PyInstaller
      # attempt — pyATS/Genie Cython modules don't survive static analysis).
      - name: Bundle sidecar with portable python (Unix)
        if: matrix.platform != 'windows-latest'
        working-directory: sidecar
        shell: bash
        env:
          CCIE_TARGET_TRIPLE: ${{ matrix.sidecar_triple }}
        run: ./scripts/build_sidecar.sh

      - name: Bundle sidecar with portable python (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: sidecar
        shell: bash
        env:
          CCIE_TARGET_TRIPLE: ${{ matrix.sidecar_triple }}
        run: ./scripts/build_sidecar.sh

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test
        env:
          CCIE_REPO_ROOT: ${{ github.workspace }}

      - name: Run frontend tests
        run: bun run test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri]

    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
              prerelease: false
            })
